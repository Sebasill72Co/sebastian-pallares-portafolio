<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Laboratorio de fondo MM2026</title>
  <link rel="stylesheet" href="../../../assets/css/dynamic-backgrounds.css?v=20260712-3">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #641e28;
      font-family: Arial, sans-serif;
    }

    .laboratorio-lienzo {
      position: fixed;
      inset: 0;
    }

    .laboratorio-panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      width: min(280px, calc(100vw - 36px));
      padding: 14px;
      display: grid;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 14px;
      background: rgba(50, 20, 30, .78);
      color: #fff;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .22);
      backdrop-filter: blur(14px);
    }

    .laboratorio-panel button {
      min-height: 40px;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 999px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .laboratorio-panel button[aria-pressed="true"] {
      background: #325541;
    }

    .laboratorio-control {
      display: grid;
      gap: 7px;
      font-size: .78rem;
    }

    .laboratorio-control span {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .laboratorio-control input {
      width: 100%;
      accent-color: #54cf88;
    }

    .laboratorio-breakpoint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: .78rem;
    }

    .laboratorio-breakpoint output {
      color: #f5f694;
      font-weight: 700;
      text-transform: uppercase;
    }

    :focus-visible {
      outline: 3px solid #f5f694;
      outline-offset: 3px;
    }

    @media (max-width: 430px) {
      .laboratorio-panel {
        right: 12px;
        bottom: 12px;
        width: min(240px, calc(100vw - 24px));
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="laboratorio-lienzo">
    <div
      class="dynamic-background"
      data-dynamic-background="mm2026-primary-lab"
      data-motion="running"
      aria-hidden="true"
    ></div>
  </main>

  <aside class="laboratorio-panel" aria-label="Controles del fondo">
    <button type="button" id="control-movimiento" aria-pressed="true">
      Movimiento: activo
    </button>

    <label class="laboratorio-control" for="control-ruido">
      <span>
        <span>Granulado</span>
        <output id="valor-ruido" for="control-ruido">80 %</output>
      </span>
      <input id="control-ruido" type="range" min="0" max="80" value="80" step="1">
    </label>

    <div class="laboratorio-breakpoint" aria-live="polite">
      <span>Breakpoint</span>
      <output id="valor-breakpoint">—</output>
    </div>
  </aside>

  <script src="../../../assets/js/maraton-2026-backgrounds.js?v=20260712-3"></script>
  <script src="../../../assets/js/dynamic-background-engine.js?v=20260712-3"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const fondo = document.querySelector("[data-dynamic-background]");
      const boton = document.querySelector("#control-movimiento");
      const ruido = document.querySelector("#control-ruido");
      const valor = document.querySelector("#valor-ruido");
      const breakpoint = document.querySelector("#valor-breakpoint");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let movimientoActivo = !reduceMotion;

      function actualizarMovimiento() {
        window.AtlasDynamicBackgrounds.establecerMovimiento(fondo, movimientoActivo);
        boton.setAttribute("aria-pressed", String(movimientoActivo));
        boton.textContent = `Movimiento: ${movimientoActivo ? "activo" : "detenido"}`;
      }

      function actualizarRuido() {
        window.AtlasDynamicBackgrounds.establecerRuido(fondo, ruido.value);
        valor.value = `${ruido.value} %`;
        valor.textContent = `${ruido.value} %`;
      }

      boton.addEventListener("click", () => {
        movimientoActivo = !movimientoActivo;
        actualizarMovimiento();
      });

      ruido.addEventListener("input", actualizarRuido);
      fondo.addEventListener("atlas:background-breakpoint", (evento) => {
        breakpoint.value = evento.detail.breakpoint;
        breakpoint.textContent = evento.detail.breakpoint;
      });
      actualizarMovimiento();
      actualizarRuido();
      breakpoint.value = fondo.dataset.dynamicBreakpoint;
      breakpoint.textContent = fondo.dataset.dynamicBreakpoint;
    });
  </script>
</body>
</html>
