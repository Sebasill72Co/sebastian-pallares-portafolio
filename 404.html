<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Sebastian Pallares Ruiz</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/images/brand/logo-personal-sebastian-pallares.svg" type="image/svg+xml">
  <style>
    :root { --navy: #0B1E35; --magenta: #D63D95; --magenta-soft: #EF67B3; --paper: #F5F1F4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--navy); color: var(--paper);
      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(720px, 100%); }
    img { width: 56px; height: 56px; display: block; margin-bottom: 48px; }
    p.kicker { margin: 0 0 18px; color: var(--magenta-soft); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.6rem, 8vw, 5rem); line-height: .95; letter-spacing: -.04em; }
    p.copy { max-width: 460px; margin: 24px 0 36px; color: rgba(245,241,244,.72); line-height: 1.55; }
    a.btn { display: inline-block; padding: 14px 22px; background: var(--magenta); color: #fff; font-weight: 800; font-size: .85rem; text-decoration: none; }
    a.btn:hover, a.btn:focus-visible { background: var(--magenta-soft); }
    a:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="Ir al inicio del portafolio"><img src="/assets/images/brand/logo-personal-sebastian-pallares.svg" alt=""></a>
    <p class="kicker">Error 404</p>
    <h1>Esta página no existe o cambió de lugar.</h1>
    <p class="copy">Puede que el enlace esté desactualizado. Desde el inicio encuentras todos los proyectos del portafolio.</p>
    <a class="btn" href="/#proyectos">Ver proyectos</a>
  </main>
</body>
</html>
